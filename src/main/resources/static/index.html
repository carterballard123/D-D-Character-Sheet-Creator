<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>D&D Character → PDF</title>
  
  <link rel="stylesheet" href="/css/style.css" />
</head>
<body>
  <header>
    <div class="wrap">
      <div class="brand">🧙‍♂️ D&D Character → PDF</div>
      <span class="pilltag">Local • Spring Boot</span>
    </div>
  </header>

  <main>
    <section class="card">
      <div class="inner">
        <h2>Character Details</h2>
        <form id="char-form" novalidate>
          <!-- Mode Toggle -->
		  <div>
		    <label>Mode</label>
		    <div class="pillbox" role="radiogroup" aria-label="Mode">
		      <label class="pill"><input type="radio" name="mode" value="raw" checked> Rules as Written</label>
		      <label class="pill"><input type="radio" name="mode" value="freedom"> Freedom</label>
		    </div>
		    <div id="modeHint" class="hint">RAW: enforces 2024 rules (background grants, class picks, feature bonuses). Freedom: anything goes.</div>
		  </div>

          <div class="grid-2">
            <div>
              <label for="characterName">Name</label>
              <input id="characterName" name="characterName" placeholder="Minsc" required />
            </div>
            <div>
              <label for="characterLevel">Level</label>
              <input id="characterLevel" name="characterLevel" type="number" min="1" max="20" value="3" required />
            </div>
          </div>

          <div class="grid-2">
            <div>
              <label for="characterClass">Class</label>
              <select id="characterClass" name="characterClass" required>
                <option value="" selected disabled hidden>Select a class</option>
              </select>
            </div>
			<div id="subclassGroup" hidden>
			  <label for="subclassName">Subclass</label>
			  <select id="subclassName" name="subclassName">
			    <option value="" selected>(optional)</option>
			  </select>
			  <div id="subclassHelp" class="hint"></div>
			</div>
		  </div>

          <div class="grid-2">
            <div>
              <label for="characterRace">Race</label>
              <select id="characterRace" name="characterRace" required>
                <option value="" selected disabled hidden>Select a race</option>
              </select>
            </div>
            <div>
              <label for="characterBackground">Background</label>
              <select id="characterBackground" name="characterBackground" required>
                <option value="" selected disabled hidden>Select a background</option>
              </select>
            </div>
          </div>

          <div>
            <label for="characterAlignment">Alignment</label>
            <select id="characterAlignment" name="characterAlignment" required>
              <option value="" selected disabled hidden>Select alignment</option>
            </select>
          </div>

          <div class="grid-3">
            <div><label for="characterStrength">STR</label><input id="characterStrength" name="characterStrength" type="number" min="1" max="30" value="15" required /></div>
            <div><label for="characterDexterity">DEX</label><input id="characterDexterity" name="characterDexterity" type="number" min="1" max="30" value="14" required /></div>
            <div><label for="characterConstitution">CON</label><input id="characterConstitution" name="characterConstitution" type="number" min="1" max="30" value="16" required /></div>
            <div><label for="characterIntelligence">INT</label><input id="characterIntelligence" name="characterIntelligence" type="number" min="1" max="30" value="10" required /></div>
            <div><label for="characterWisdom">WIS</label><input id="characterWisdom" name="characterWisdom" type="number" min="1" max="30" value="12" required /></div>
            <div><label for="characterCharisma">CHA</label><input id="characterCharisma" name="characterCharisma" type="number" min="1" max="30" value="8" required /></div>
          </div>

          <div class="grid-2">
            <div>
              <label for="armorName">Armor</label>
              <select id="armorName" name="armorName">
                <option value="" selected disabled hidden>Choose armor</option>
              </select>
              <div id="armorStatus" class="hint"></div>
            </div>
            <div>
              <label for="shieldName">Shield</label>
              <select id="shieldName" name="shieldName">
                <option value="" selected disabled hidden>Choose shield</option>
              </select>
            </div>
          </div>

          <div class="grid-2">
            <div>
              <label>Languages</label>
              <div id="languagesBox" class="pillbox"></div>
            </div>
            <div>
              <label>Skills</label>
              <div id="skillsBox" class="pillbox"></div>
            </div>
          </div>

          <div class="actions">
            <button id="submitBtn" type="submit">Generate PDF</button>
            <span class="hint">Returns <code>application/pdf</code> from <code>/api/pdf/fill</code></span>
          </div>
          <div id="msg" class="msg muted">Fill the form and click Generate.</div>
        </form>
      </div>
    </section>
  </main>

  <footer>
    <div class="wrap">Served by Spring Boot on <code>/</code></div>
  </footer>
  <script src="/js/app.js" defer></script>
</body>
</html>
