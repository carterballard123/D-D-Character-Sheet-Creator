<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>D&D Character → PDF</title>
  <style>
    :root{
      --bg:#0b1020;--panel:#0f172a;--soft:#111827;--text:#e5e7eb;--muted:#9ca3af;--ring:#334155;
      --brand:#60a5fa;--brand2:#22d3ee;--ok:#16a34a;--err:#ef4444;
    }
    *{box-sizing:border-box}
    html,body{height:100%}
    body{margin:0;background:linear-gradient(120deg,var(--bg),#0a0f1f);color:var(--text);font-family:system-ui,-apple-system,Segoe UI,Roboto,Ubuntu,Cantarell,Noto Sans,sans-serif;}

    header{position:sticky;top:0;z-index:10;background:rgba(15,23,42,.8);backdrop-filter:blur(8px);border-bottom:1px solid rgba(255,255,255,.06)}
    .wrap{max-width:1000px;margin:0 auto;padding:14px 16px;display:flex;align-items:center;gap:16px}
    .brand{font-weight:800;letter-spacing:.2px}
    .pilltag{font-size:12px;color:#0b1020;background:linear-gradient(135deg,var(--brand),var(--brand2));padding:6px 10px;border-radius:999px}

    main{max-width:1000px;margin:24px auto;padding:0 16px 48px;display:grid;gap:16px}

    .card{background:linear-gradient(180deg,var(--panel),var(--soft));border:1px solid rgba(255,255,255,.08);border-radius:16px;box-shadow:0 16px 40px rgba(0,0,0,.35)}
    .card .inner{padding:18px}
    .card h2{margin:0 0 8px 0;font-size:18px;color:var(--brand2)}

    form{display:grid;gap:16px}
    .grid-2{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:12px}
    .grid-3{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:12px}
    @media (max-width:800px){.grid-2,.grid-3{grid-template-columns:1fr}}

    label{display:block;font-size:13px;color:var(--muted);margin-bottom:6px}
    input,select{width:100%;padding:10px 12px;border-radius:10px;border:1px solid var(--ring);background:#0a0f1a;color:var(--text)}
    select:invalid{color:var(--muted)}
    .hint{font-size:12px;color:var(--muted)}

    .pillbox{display:grid;grid-template-columns:repeat(auto-fit,minmax(140px,1fr));gap:8px}
    .pill{display:inline-flex;align-items:center;gap:8px;padding:8px 12px;border:1px solid rgba(255,255,255,.18);border-radius:999px;background:#0a0f1a}
    .pill.disabled{opacity:.5;filter:saturate(.6)}

    .actions{display:flex;gap:10px;align-items:center}
    button{cursor:pointer;border:0;border-radius:12px;background:linear-gradient(135deg,var(--brand2),var(--brand));color:#08131a;padding:12px 16px;font-weight:800}
    button:disabled{opacity:.6;filter:saturate(.6)}

    .msg{border-radius:12px;padding:10px 12px;font-size:14px}
    .msg.ok{background:#062413;border:1px solid #134e21;color:#b7f7c7}
    .msg.err{background:#2a0f12;border:1px solid #6b0f1a;color:#fecaca}
    .msg.muted{background:#0b1220;border:1px dashed #253046;color:var(--muted)}

    footer{opacity:.7;text-align:center;padding:18px;font-size:12px}
    code{font-family:ui-monospace,SFMono-Regular,Menlo,Monaco,Consolas,monospace}
  </style>
</head>
<body>
  <header>
    <div class="wrap">
      <div class="brand">🧙‍♂️ D&D Character → PDF</div>
      <span class="pilltag">Local • Spring Boot</span>
    </div>
  </header>

  <main>
    <section class="card">
      <div class="inner">
        <h2>Character Details</h2>
        <form id="char-form" novalidate>
          <!-- Mode Toggle -->
		  <div>
		    <label>Mode</label>
		    <div class="pillbox" role="radiogroup" aria-label="Mode">
		      <label class="pill"><input type="radio" name="mode" value="raw" checked> Rules as Written</label>
		      <label class="pill"><input type="radio" name="mode" value="freedom"> Freedom</label>
		    </div>
		    <div id="modeHint" class="hint">RAW: enforces 2024 rules (background grants, class picks, feature bonuses). Freedom: anything goes.</div>
		  </div>

          <div class="grid-2">
            <div>
              <label for="characterName">Name</label>
              <input id="characterName" name="characterName" placeholder="Minsc" required />
            </div>
            <div>
              <label for="characterLevel">Level</label>
              <input id="characterLevel" name="characterLevel" type="number" min="1" max="20" value="3" required />
            </div>
          </div>

          <div class="grid-2">
            <div>
              <label for="characterClass">Class</label>
              <select id="characterClass" name="characterClass" required>
                <option value="" selected disabled hidden>Select a class</option>
              </select>
            </div>
            <div>
              <label for="subclassName">Subclass</label>
              <select id="subclassName" name="subclassName">
                <option value="" selected>(optional)</option>
              </select>
            </div>
          </div>

          <div class="grid-2">
            <div>
              <label for="characterRace">Race</label>
              <select id="characterRace" name="characterRace" required>
                <option value="" selected disabled hidden>Select a race</option>
              </select>
            </div>
            <div>
              <label for="characterBackground">Background</label>
              <select id="characterBackground" name="characterBackground" required>
                <option value="" selected disabled hidden>Select a background</option>
              </select>
            </div>
          </div>

          <div>
            <label for="characterAlignment">Alignment</label>
            <select id="characterAlignment" name="characterAlignment" required>
              <option value="" selected disabled hidden>Select alignment</option>
            </select>
          </div>

          <div class="grid-3">
            <div><label for="characterStrength">STR</label><input id="characterStrength" name="characterStrength" type="number" min="1" max="30" value="15" required /></div>
            <div><label for="characterDexterity">DEX</label><input id="characterDexterity" name="characterDexterity" type="number" min="1" max="30" value="14" required /></div>
            <div><label for="characterConstitution">CON</label><input id="characterConstitution" name="characterConstitution" type="number" min="1" max="30" value="16" required /></div>
            <div><label for="characterIntelligence">INT</label><input id="characterIntelligence" name="characterIntelligence" type="number" min="1" max="30" value="10" required /></div>
            <div><label for="characterWisdom">WIS</label><input id="characterWisdom" name="characterWisdom" type="number" min="1" max="30" value="12" required /></div>
            <div><label for="characterCharisma">CHA</label><input id="characterCharisma" name="characterCharisma" type="number" min="1" max="30" value="8" required /></div>
          </div>

          <div class="grid-2">
            <div>
              <label for="armorName">Armor</label>
              <select id="armorName" name="armorName">
                <option value="" selected disabled hidden>Choose armor</option>
              </select>
              <div id="armorStatus" class="hint"></div>
            </div>
            <div>
              <label for="shieldName">Shield</label>
              <select id="shieldName" name="shieldName">
                <option value="" selected disabled hidden>Choose shield</option>
              </select>
            </div>
          </div>

          <div class="grid-2">
            <div>
              <label>Languages</label>
              <div id="languagesBox" class="pillbox"></div>
            </div>
            <div>
              <label>Skills</label>
              <div id="skillsBox" class="pillbox"></div>
            </div>
          </div>

          <div class="actions">
            <button id="submitBtn" type="submit">Generate PDF</button>
            <span class="hint">Returns <code>application/pdf</code> from <code>/api/pdf/fill</code></span>
          </div>
          <div id="msg" class="msg muted">Fill the form and click Generate.</div>
        </form>
      </div>
    </section>
  </main>

  <footer>
    <div class="wrap">Served by Spring Boot on <code>/</code></div>
  </footer>

  <script>
    // ===== Helpers =====
    const $ = (id) => document.getElementById(id);

	function computeRAW(ctx){
	  const cls = findByName(cache.classes, ctx.class) || { profSkills:{choose:0, from:[]} , featuresByLevel:{} };
	  const bg  = findByName(cache.backgrounds, ctx.background) || { fixedSkills:[], languages:{grant:[], choose:0, from:"ANY"} };
	  const level = Number($('characterLevel').value || 1);

	  // base class skill picks
	  let classChoose = Number(cls.profSkills.choose || 0);
	  let pool = new Set(cls.profSkills.from.map(String));

	  // add feature-based picks up to current level (e.g., Barbarian Primal Knowledge @3)
	  const featureDefs = SKILL_FEATURE_BONUSES[(cls.id||'').toLowerCase()] || [];
	  for (let L = 1; L <= level; L++){
	    const feats = toArray(cls.featuresByLevel?.[String(L)]);
	    for (const f of feats){
	      const nm = (f?.name||'');
	      for (const def of featureDefs){
	        if (def.nameRegex.test(nm)){
	          classChoose += (def.choose||0);
	          // def.from==="classList" means same pool as class.from
	        }
	      }
	    }
	  }

	  // background grants
	  const grantedSkills = new Set(bg.fixedSkills.map(String));

	  // languages
	  const allLangNames = new Set((cache.languages || []).map(x => (typeof x==='string')?x:(x.name||x.languageName||String(x))));
	  const langGrant = new Set((bg.languages?.grant || []).map(String));
	  const langFrom  = bg.languages?.from === "ANY" ? new Set(allLangNames) : new Set(toArray(bg.languages?.from).map(String));
	  const langChoose= Number(bg.languages?.choose || 0);

	  return {
	    skills: { grant: grantedSkills, from: pool, choose: classChoose },
	    languages: { grant: langGrant, from: langFrom.size?langFrom:allLangNames, choose: langChoose }
	  };
	}
	
    async function fetchJson(url){
      const r = await fetch(url);
      if(!r.ok) throw new Error(url+" → HTTP "+r.status);
      return r.json();
    }

    function prettyEnum(tok){
      return String(tok||'').toLowerCase().split('_').map(s=>s.charAt(0).toUpperCase()+s.slice(1)).join(' ');
    }
	
	const SKILL_FEATURE_BONUSES = {
	  barbarian: [
	    { nameRegex: /Primal Knowledge/i, choose: 1, from: "classList" }
	  ],
	};
	
	// Small helpers
	const toArray = v => Array.isArray(v) ? v : (v != null ? [v] : []);
	const modeValue = () => document.querySelector('input[name="mode"]:checked')?.value || 'raw';
	const isRAW = () => modeValue() === 'raw';

	// Make your JSONs look uniform to the UI (no need to change your files)
	function normalizeClass(c){
	  return {
	    id: c.classID || c.name,
	    name: c.name || c.classID,
	    profSkills: {
	      choose: c?.proficiencies?.skills?.choose ?? 0,
	      from: toArray(c?.proficiencies?.skills?.from).map(String)
	    },
	    featuresByLevel: c?.featuresByLevel || {}
	  };
	}
	function normalizeBackground(b){
	  // If you later add languages to backgrounds, use this shape:
	  // "languages": { "grant": ["Common"], "choose": 1, "from": "ANY" }  // or from: ["Dwarvish","Elvish"]
	  const lang = b.languages || {};
	  return {
	    name: b.name,
	    fixedSkills: toArray(b.skillProficiencies).map(String),
	    languages: {
	      grant: toArray(lang.grant).map(String),
	      choose: Number(lang.choose || 0),
	      from: lang.from || "ANY"
	    },
	    _raw: b
	  };
	}
	function normalizeRace(r){ return { name: r.name, _raw: r }; }

	// A handy finder by name/classID/etc.
	const findByName = (list, name) => {
	  const key = String(name||'').toLowerCase();
	  return list.find(it =>
	    [it?.name, it?.className, it?.classID, it?.subclassName]
	      .some(n => String(n||'').toLowerCase() === key)
	  );
	};

    function guessName(obj){
      if(!obj || typeof obj !== 'object') return String(obj ?? '');
      const order = ['name','armorName','raceName','className','backgroundName','shieldName','subclassName','displayName','title'];
      for(const k of order){ if(typeof obj[k] === 'string' && obj[k]) return obj[k]; }
      for(const k of Object.keys(obj)){ const v = obj[k]; if(typeof v === 'string' && /name$/i.test(k)) return v; }
      for(const k of Object.keys(obj)){ const v = obj[k]; if(typeof v === 'string') return v; }
      return '';
    }

    function populateSelect(sel, items, {placeholder, sort=true}={}){
      const arr = Array.from(items || []);
      const labels = arr.map(x => {
        const label = (typeof x === 'string') ? x : guessName(x);
        return { label, value: label };
      }).filter(x => x.label && x.value);
      if(sort) labels.sort((a,b)=>a.label.localeCompare(b.label));
      const opts = [];
      if(placeholder) opts.push(`<option value="" selected disabled hidden>${placeholder}</option>`);
      for(const it of labels){ opts.push(`<option value="${it.value}">${it.label}</option>`); }
      sel.innerHTML = opts.join('');
    }

    // Enhanced checkbox renderer that supports objects, RAW filtering, and preserves selections.
	function renderChoicePills(containerId, {titleGrant, titleChoose}, name, allItems, grantSet, poolSet, chooseCount){
	  const box = $(containerId);
	  const prevChecked = new Set(getChecked(name));
	  const all = Array.from(allItems).map(String).sort((a,b)=>a.localeCompare(b));

	  const granted   = all.filter(v => grantSet.has(v));
	  const choosable = all.filter(v => !grantSet.has(v) && (!poolSet || poolSet.has(v)));

	  const alreadyChosen = [...prevChecked].filter(v => choosable.includes(v));
	  const chosenCount = Math.min(alreadyChosen.length, chooseCount);
	  const maxed = chooseCount > 0 && chosenCount >= chooseCount;

	  const h = [];
	  if (granted.length){
	    h.push(`<div class="hint" style="margin:6px 0">${titleGrant} (${granted.length})</div>`);
	    h.push(granted.map(v =>
	      `<label class="pill disabled" title="Granted by Background">
	         <input type="checkbox" name="${name}" value="${v}" checked disabled> ${v}
	       </label>`).join('')
	    );
	  }
	  if (chooseCount > 0){
	    const left = chooseCount - chosenCount;
	    h.push(`<div class="hint" style="margin:10px 0 6px">${titleChoose} — pick <b>${chooseCount}</b> (left: <b id="${name}-left">${left}</b>)</div>`);
	    h.push(choosable.map(v => {
	      const checked = prevChecked.has(v);
	      const dis = (!checked && maxed) ? 'disabled' : '';
	      return `<label class="pill ${dis?'disabled':''}">
	                <input type="checkbox" name="${name}" value="${v}" ${checked?'checked':''} ${dis}>
	                ${v}
	              </label>`;
	    }).join(''));
	  }
	  if (chooseCount === 0 && choosable.length){
	    h.push(`<div class="hint" style="margin:10px 0 6px">Optional</div>`);
	    h.push(choosable.map(v =>
	      `<label class="pill">
	        <input type="checkbox" name="${name}" value="${v}" ${prevChecked.has(v)?'checked':''}>
	        ${v}
	      </label>`).join('')
	    );
	  }
	  box.innerHTML = h.join('\n');

	  // live limit enforcement
	  box.onchange = (e) => {
	    if (e.target?.name !== name) return;
	    if (chooseCount <= 0) return;
	    const picks = getChecked(name).filter(v => choosable.includes(v)).length;
	    const left = Math.max(0, chooseCount - picks);
	    const counter = document.getElementById(`${name}-left`);
	    if (counter) counter.textContent = String(left);
	    const disable = picks >= chooseCount;
	    box.querySelectorAll(`input[name="${name}"]`).forEach(inp => {
	      if (inp.checked) return;
	      if (choosable.includes(inp.value)) {
	        inp.disabled = disable;
	        inp.closest('.pill')?.classList.toggle('disabled', disable);
	      }
	    });
	  };
	}

	function refreshPills(){
	  const mode = modeValue();

	  if (mode === 'freedom'){
	    // everything selectable, no limits
	    const allLangs = new Set((cache.languages||[]).map(x => typeof x === 'string' ? x : (x.name||x.languageName)));
	    const allSkills= new Set((cache.skills||[]).map(String));
	    renderChoicePills('languagesBox', {titleGrant:'Granted', titleChoose:'Languages'}, 'languages', allLangs, new Set(), null, 0);
	    renderChoicePills('skillsBox',    {titleGrant:'Granted', titleChoose:'Skills'},    'skills',    allSkills, new Set(), null, 0);
	    return;
	  }

	  // RAW
	  const rules = computeRAW({
	    class: $('characterClass').value || null,
	    background: $('characterBackground').value || null,
	    race: $('characterRace').value || null
	  });

	  // Languages
	  const langAll = new Set([ ...rules.languages.grant, ...rules.languages.from ]);
	  renderChoicePills(
	    'languagesBox',
	    {titleGrant:'Granted by Background', titleChoose:'Languages (RAW)'},
	    'languages',
	    langAll,
	    rules.languages.grant,
	    rules.languages.from,
	    rules.languages.choose
	  );

	  // Skills
	  const allSkillNames = new Set((cache.skills||[]).map(String));
	  const skillPool = new Set([...rules.skills.from].filter(s => allSkillNames.has(s)));
	  const skillAll  = new Set([ ...rules.skills.grant, ...skillPool ]);
	  renderChoicePills(
	    'skillsBox',
	    {titleGrant:'Granted by Background', titleChoose:'Class Skill Choices (RAW)'},
	    'skills',
	    skillAll,
	    rules.skills.grant,
	    skillPool,
	    rules.skills.choose
	  );
	}

    function getChecked(name){
      return Array.from(document.querySelectorAll(`input[name="${name}"]:checked`)).map(i=>i.value);
    }

    function setMsg(kind, text){
      const el = $('msg'); el.className = 'msg ' + (kind||'muted'); el.textContent = text;
    }

    // ===== Caches so we can re-filter in place =====
    const cache = {
      classes: [], subclasses: [], races: [], backgrounds: [],
      armors: [], shields: [], languages: [], skills: []
    };

    // ===== Loaders =====
	async function loadClasses(){
	  const data = await fetchJson('/api/reference/classes');
	  cache.classes = (data || []).map(normalizeClass);
	  populateSelect($('characterClass'), cache.classes, { placeholder:'Select a class' });
	}

    async function loadSubclasses(forClass){
      try{
        if (!cache.subclasses.length) {
          cache.subclasses = await fetchJson('/api/reference/subclasses');
        }
        const filtered = forClass
          ? cache.subclasses.filter(sc => {
              const parent = sc.className ?? sc.parentClass ?? sc.forClass ?? sc.baseClass;
              return String(parent||'').toLowerCase() === String(forClass||'').toLowerCase();
            })
          : cache.subclasses;
        populateSelect($('subclassName'), filtered, { placeholder:'(optional)' });
      }catch(e){
        $('subclassName').innerHTML = '<option value="">(no subclasses)</option>';
      }
    }

	async function loadRaces(){
	  const data = await fetchJson('/api/reference/races');
	  cache.races = (data || []).map(normalizeRace);
	  populateSelect($('characterRace'), cache.races, { placeholder:'Select a race' });
	}

	async function loadBackgrounds(){
	  const data = await fetchJson('/api/reference/backgrounds');
	  cache.backgrounds = (data || []).map(normalizeBackground);
	  populateSelect($('characterBackground'), cache.backgrounds, { placeholder:'Select a background' });
	}

    async function loadArmors(){
      const data = await fetchJson('/api/reference/armor');
      cache.armors = data || [];
      populateSelect($('armorName'), cache.armors, { placeholder:'Choose armor' });
      $('armorStatus').textContent = `Loaded ${cache.armors.length} armors`;
    }

    async function loadShields(){
      const data = await fetchJson('/api/reference/shields');
      cache.shields = data || [];
      populateSelect($('shieldName'), cache.shields, { placeholder:'Choose shield' });
    }

	async function loadLanguages(){
	  try {
	    const data = await fetchJson('/api/reference/languages');
	    cache.languages = (data || []).map(x => (typeof x==='string') ? x : (x.name || x.languageName)).filter(Boolean);
	  } catch { cache.languages = []; }
	  refreshPills();
	}

	async function loadSkills(){
	  try {
	    const data = await fetchJson('/api/reference/skills');
	    cache.skills = (data || []).map(String);
	  } catch { cache.skills = []; }
	  refreshPills();
	}

    async function loadAlignments(){
      try{
        const data = await fetchJson('/api/enums/alignments');
        const items = (data||[]).map(x => ({label: prettyEnum(x), value: String(x)}));
        const sel = $('characterAlignment');
        sel.innerHTML = ['<option value="" selected disabled hidden>Select alignment</option>']
          .concat(items.map(it => `<option value="${it.value}">${it.label}</option>`)).join('');
      }catch(e){
        const tokens = ['LAWFUL_GOOD','NEUTRAL_GOOD','CHAOTIC_GOOD','LAWFUL_NEUTRAL','NEUTRAL','CHAOTIC_NEUTRAL','LAWFUL_EVIL','NEUTRAL_EVIL','CHAOTIC_EVIL'];
        const items = tokens.map(x => ({label: prettyEnum(x), value: x}));
        $('characterAlignment').innerHTML = ['<option value="" selected disabled hidden>Select alignment</option>']
          .concat(items.map(it => `<option value="${it.value}">${it.label}</option>`)).join('');
      }
    }

    function ctx(){
      return {
        class: $('characterClass').value || null,
        race: $('characterRace').value || null,
        background: $('characterBackground').value || null
      };
    }

    // ===== Submit =====
    const form = $('char-form');
    const btn  = $('submitBtn');

    form.addEventListener('submit', async (e) => {
      e.preventDefault();
      setMsg('muted','Submitting…');
      btn.disabled = true;

      const fd = new FormData(form);
      const payload = Object.fromEntries(fd.entries());

      ['characterLevel','characterStrength','characterDexterity','characterConstitution','characterIntelligence','characterWisdom','characterCharisma']
        .forEach(k => { if(payload[k] !== undefined) payload[k] = Number(payload[k]); });

      payload.languages = getChecked('languages');
      payload.skills    = getChecked('skills');
      payload.mode      = modeValue(); // include chosen mode (server can ignore if not needed)

      try{
        const res = await fetch('/api/pdf/fill', { method:'POST', headers:{'Content-Type':'application/json'}, body: JSON.stringify(payload) });
        const ctype = res.headers.get('content-type')||'';
        if(!res.ok){
          if(ctype.includes('application/json')){
            const err = await res.json();
            const lines = (err.errors||[]).map(e => (e.field||e?.cause?.field||'field')+': '+(e.message||e?.defaultMessage||'invalid')).join('\n');
            setMsg('err', `Error ${res.status}${lines? "\n"+lines : ""}`);
          }else{
            setMsg('err', `Error ${res.status}: ` + await res.text());
          }
          return;
        }

        if(ctype.includes('application/pdf')){
          const blob = await res.blob();
          if(blob.size < 5){ setMsg('err','Server returned empty PDF bytes'); return; }
          const url = URL.createObjectURL(blob);
          const a = Object.assign(document.createElement('a'), { href:url, download:'character.pdf' });
          document.body.appendChild(a); a.click(); a.remove(); URL.revokeObjectURL(url);
          setMsg('ok','PDF generated. Check your downloads.');
        } else {
          setMsg('err','Unexpected response (not a PDF).');
        }
      }catch(err){
        setMsg('err','Network/JS error: '+(err.message||err));
      }finally{
        btn.disabled = false;
      }
    });

	// ===== Boot =====
	(async function init(){
	  try{
	    // 1) Load base reference data in parallel
	    await Promise.all([
	      loadClasses(),
	      loadRaces(),
	      loadBackgrounds(),
	      loadArmors(),
	      loadShields(),
	      loadAlignments()
	    ]);

	    // 2) Subclasses depend on class + mode
	    await loadSubclasses(isRAW() ? ($('characterClass').value || null) : null);

	    // 3) Load Languages/Skills, then render pills once
	    await Promise.all([loadLanguages(), loadSkills()]);

	    // 4) Wiring — single registrations (no nesting)
	    $('characterClass').addEventListener('change', (e) => {
	      loadSubclasses(isRAW() ? e.target.value : null);
	      refreshPills();
	    });
	    $('characterRace').addEventListener('change', refreshPills);
	    $('characterBackground').addEventListener('change', refreshPills);
	    document.querySelectorAll('input[name="mode"]').forEach((r) => {
	      r.addEventListener('change', () => {
	        loadSubclasses(isRAW() ? ($('characterClass').value || null) : null);
	        refreshPills();
	      });
	    });

	    setMsg('muted','Ready. Fill the form and click Generate.');
	  }catch(e){
	    console.error(e);
	    setMsg('err','Failed to load reference data: ' + (e.message || e));
	  }
	})();
  </script>
</body>
</html>
