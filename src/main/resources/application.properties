spring.application.name=D&D Character Creator

# Defaults match .env.example / compose.yaml exactly, so a fresh clone + a
# plain `docker compose up` "just works" without any extra configuration.
# Override any of these with a real environment variable (DB_URL, DB_USERNAME,
# DB_PASSWORD) for a non-local environment - nothing here is hardcoded only.
spring.datasource.url=${DB_URL:jdbc:postgresql://localhost:5432/dndcc}
spring.datasource.username=${DB_USERNAME:dndcc}
spring.datasource.password=${DB_PASSWORD:dndcc_dev_password}

# validate (not update/create): Flyway migrations are the only thing allowed
# to change the schema. Hibernate is only allowed to check that the schema
# it sees matches what the entities expect, and fail loudly if not.
spring.jpa.hibernate.ddl-auto=validate

spring.flyway.enabled=true
